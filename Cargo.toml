[package]
name = "lambdaattack"
version = "2.4.0"
edition = "2021"
license = "Unlicense"
description = "LambdaAttack — Minecraft stress-test bot"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
pico-args = "0.5"
directories = "6"
clap = { version = "4", features = ["derive"] }
daemon-kit = "0.1"
proxied = "1"
gamedig = "0.6"
reqwest = { version = "0.12", features = ["socks", "cookies"] }
